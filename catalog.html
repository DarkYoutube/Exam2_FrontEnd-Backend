<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог – Bootstrap Shop</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Bootstrap Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link active" href="catalog.html">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
                    <li class="nav-item"><a class="nav-link" href="order.html">Заявка</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <main class="container my-5">
        <div class="alert alert-info" role="alert">
            Выберите товар из каталога. Карточки оформлены с помощью компонента Bootstrap <code>card</code>.
        </div>

        <h1 class="h2 mb-4">Каталог товаров</h1>

        <div class="row g-4">

            <div class="col-12 col-md-6 col-lg-4">
                <div class="card h-100 shadow-sm">
                    <!-- <img src="images/image1.png" class="card-img-top" alt="Товар 1"> -->
                    <div class="card-body d-flex flex-column">
                        <span class="badge bg-success align-self-start mb-2">Новинка</span>
                        <h3 class="card-title h5">Товар 1</h3>
                        <p class="card-text text-muted">Краткое описание.</p>
                        <p class="fw-bold fs-5 mt-auto">1000 руб.</p>
                        <div class="d-flex gap-2">
                            <a href="product.html" class="btn btn-primary">Подробнее</a>
                            <!-- Кнопка, открывающая модалку -->
                            <button type="button" class="btn btn-outline-primary" data-bs-toggle="modal" data-bs-target="#orderModal">Заказать</button>
                        </div>
                    </div>
                </div>
            </div>
            <!-- Другие карточки по аналогии... -->
        </div>
    </main>

    <!-- Модальное окно (из ПЗ №10) -->
    <div class="modal fade" id="orderModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Быстрая заявка</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form>
                        <div class="mb-3">
                            <label class="form-label">Имя</label>
                            <input type="text" class="form-control" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Телефон</label>
                            <input type="tel" class="form-control" required>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                    <button type="button" class="btn btn-primary">Отправить</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
