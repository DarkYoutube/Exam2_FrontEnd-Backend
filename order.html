<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Заявка – Bootstrap Shop</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="css/custom.css">
</head>
<body class="d-flex flex-column min-vh-100 bg-light">


    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="index.html">Bootstrap Shop</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNavbar">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="mainNavbar">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Главная</a></li>
                    <li class="nav-item"><a class="nav-link" href="catalog.html">Каталог</a></li>
                    <li class="nav-item"><a class="nav-link" href="product.html">Товар</a></li>
                    <li class="nav-item"><a class="nav-link active" href="order.html">Заявка</a></li>
                </ul>
            </div>
        </div>
    </nav>


    <main class="container my-5 flex-grow-1">
        <div class="row justify-content-center">
            <div class="col-12 col-lg-8">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h1 class="h4 mb-0">Форма заявки</h1>
                    </div>
                    <div class="card-body">

                        <div class="alert alert-info" role="alert">
                            Заполните форму. Поля со звёздочкой обязательны для заполнения.
                        </div>


                        <form>
                            <div class="row g-3">

                                <div class="col-12 col-md-6">
                                    <label for="order-name" class="form-label">Имя *</label>
                                    <input type="text" id="order-name" name="name" class="form-control" placeholder="Введите имя" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="order-email" class="form-label">E-mail *</label>
                                    <input type="email" id="order-email" name="email" class="form-control" placeholder="example@mail.ru" required>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="order-phone" class="form-label">Телефон</label>
                                    <div class="input-group">
                                        <span class="input-group-text">+7</span>
                                        <input type="tel" id="order-phone" name="phone" class="form-control" placeholder="900 000-00-00">
                                    </div>
                                </div>

                                <div class="col-12 col-md-6">
                                    <label for="order-product" class="form-label">Товар</label>
                                    <select id="order-product" name="product" class="form-select">
                                        <option selected>Выберите товар</option>
                                        <option value="1">Товар 1</option>
                                        <option value="2">Товар 2</option>
                                        <option value="3">Товар 3</option>
                                    </select>
                                </div>

                                <div class="col-12">
                                    <label for="order-comment" class="form-label">Комментарий</label>
                                    <textarea id="order-comment" name="comment" class="form-control" rows="3" placeholder="Дополнительная информация"></textarea>
                                </div>

                                <div class="col-12">
                                    <div class="form-check">
                                        <input class="form-check-input" type="checkbox" id="order-agree" required>
                                        <label class="form-check-label" for="order-agree">
                                            Я согласен на обработку данных *
                                        </label>
                                    </div>
                                </div>

                                <!-- Кнопки -->
                                <div class="col-12 mt-4">
                                    <button type="submit" class="btn btn-primary px-4">Отправить заявку</button>
                                    <button type="reset" class="btn btn-outline-secondary px-4 ms-2">Очистить</button>
                                </div>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </main>


    <footer class="bg-dark text-white py-4 mt-auto">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 Bootstrap Shop. Учебный проект.</p>
        </div>
    </footer>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
